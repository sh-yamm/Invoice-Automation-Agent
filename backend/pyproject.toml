[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-agent"
version = "0.1.0"
description = "India-first accounts-payable invoice agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  "reportlab>=4.2",
  "pillow>=10.3",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", ".."]
testpaths = ["tests"]
addopts = "-m 'not live' --import-mode=importlib -p no:dash -p no:cacheprovider"
markers = ["live: hits real NVIDIA endpoints"]
filterwarnings = [
  "ignore:pkg_resources is deprecated:UserWarning",
  "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning",
  "ignore:Passing 'msg' argument to (Task|Future).cancel:DeprecationWarning",
]
