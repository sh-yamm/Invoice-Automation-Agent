# Running pytest from the repository root uses these settings (they mirror backend/pyproject.toml).
# Without this file a root run would ignore the backend's settings and also run tests/live, which calls the real
# NVIDIA models and spends credits. Run those on purpose with: python -m pytest -m live backend/tests/live
[pytest]
pythonpath = backend/src backend/tests .
testpaths = backend/tests
addopts = -m "not live" --import-mode=importlib -p no:dash -p no:cacheprovider
markers =
    live: hits real NVIDIA endpoints
filterwarnings =
    ignore:pkg_resources is deprecated:UserWarning
    ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning
    ignore:Passing 'msg' argument to (Task|Future).cancel:DeprecationWarning
