# Streamlit theme: matches the Thumbstop Engine reference (cream paper, Fraunces headings, rust accent).
[theme]
base = "light"
primaryColor = "#b5502c"
backgroundColor = "#fffaf4"
secondaryBackgroundColor = "#fbeadb"
textColor = "#2e1f17"
linkColor = "#8f3c1f"
borderColor = "#d6bb9f"
showWidgetBorder = true
baseRadius = "10px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
maxUploadSize = 10

[browser]
gatherUsageStats = false
